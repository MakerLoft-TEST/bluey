<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepy Uppy - Bluey Inspired Arcade Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue background */
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 4px 4px 0 #3B82F6, -2px -2px 0 #3B82F6, 2px -2px 0 #3B82F6, -2px 2px 0 #3B82F6, 2px 2px 0 #3B82F6, 5px 5px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10;
            letter-spacing: 2px;
        }
        @keyframes pop {
            0% { transform: translateX(-50%) scale(1); }
            40% { transform: translateX(-50%) scale(1.5) rotate(-5deg); color: #FFD700; }
            100% { transform: translateX(-50%) scale(1); }
        }
        .score-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .start-screen, .game-over-screen {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 1.5rem;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            pointer-events: auto;
            border: 5px solid #3B82F6;
            transform: scale(0.9);
            animation: screenIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes screenIn {
            to { transform: scale(1); }
        }
        button {
            background-color: #EF4444; /* Balloon red */
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.4rem;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 900;
            margin-top: 1.5rem;
            transition: all 0.1s;
            box-shadow: 0 6px 0 #B91C1C, 0 10px 10px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #DC2626;
            transform: translateY(2px);
            box-shadow: 0 4px 0 #B91C1C, 0 5px 5px rgba(0,0,0,0.2);
        }
        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #B91C1C;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div class="score-display" id="scoreDisplay" style="display: none;">0</div>

    <div class="ui-layer" id="uiLayer">
        <div class="start-screen" id="startScreen">
            <h1 class="text-5xl font-black text-blue-600 mb-3 drop-shadow-md tracking-wide">KEEPY UPPY!</h1>
            <p class="text-lg text-gray-800 mb-4 font-bold">Don't let the balloon touch the ground!</p>
            <p class="text-md text-gray-600 mb-6 bg-gray-100 p-3 rounded-lg border border-gray-200">Use Left/Right arrows or drag</p>
            <button onclick="startGame()">Play Now</button>
        </div>

        <div class="game-over-screen" id="gameOverScreen" style="display: none;">
            <h1 class="text-5xl font-black text-red-500 mb-3 drop-shadow-md tracking-wide">Oh Biscuits!</h1>
            <p class="text-xl text-gray-800 mb-3 font-bold">The balloon hit the ground.</p>
            <p class="text-3xl font-black text-blue-600 mb-6 bg-blue-50 p-4 rounded-xl border-2 border-blue-200">Score: <span id="finalScore">0</span></p>
            <button onclick="startGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScoreSpan = document.getElementById('finalScore');

        // Responsive canvas
        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth, 800);
            canvas.height = window.innerHeight;
            if(player) {
                player.y = canvas.height - player.height - 40; // 40 is grass height
            }
        }
        window.addEventListener('resize', resizeCanvas);

        let animationId;
        let score = 0;
        let gameActive = false;

        // Visual FX State
        let screenShake = 0;
        let screenZoom = 1;
        let particles = [];
        let floatingTexts = [];
        let trail = [];

        // Colors
        const BLUEY_COLOR = '#60A5FA';
        const BLUEY_DARK = '#2563EB';
        const BALLOON_COLOR = '#EF4444';

        const player = {
            width: 80,
            height: 60,
            x: 0,
            y: 0,
            speed: 10,
            dx: 0,
            targetX: null
        };

        const balloon = {
            radius: 25,
            x: 0,
            y: 0,
            dx: 0,
            dy: 0,
            gravity: 0.2,
            bounce: -0.85,
            baseDy: -9
        };

        function initEntities() {
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - player.height - 40;
            player.dx = 0;
            player.targetX = null;

            balloon.x = canvas.width / 2;
            balloon.y = 100;
            balloon.dx = (Math.random() - 0.5) * 6;
            balloon.dy = 0;
        }

        // Controls
        const keys = {
            ArrowLeft: false,
            ArrowRight: false
        };

        window.addEventListener('keydown', e => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = true;
            }
        });

        window.addEventListener('keyup', e => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = false;
            }
        });

        // Touch / Mouse controls
        let isDragging = false;
        
        function handleMove(e) {
            if (!gameActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = canvas.getBoundingClientRect();
            player.targetX = clientX - rect.left - player.width / 2;
        }

        canvas.addEventListener('mousedown', e => { isDragging = true; handleMove(e); });
        canvas.addEventListener('mousemove', e => { if (isDragging) handleMove(e); });
        window.addEventListener('mouseup', () => { isDragging = false; player.targetX = null; });
        
        canvas.addEventListener('touchstart', e => { handleMove(e); }, {passive: true});
        canvas.addEventListener('touchmove', e => { handleMove(e); }, {passive: true});
        canvas.addEventListener('touchend', () => { player.targetX = null; });

        function drawPlayer() {
            ctx.fillStyle = BLUEY_COLOR;
            // Draw a rounded rectangle for the dog body
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.width, player.height, 10);
            ctx.fill();

            // Ears
            ctx.fillStyle = BLUEY_DARK;
            ctx.beginPath();
            ctx.moveTo(player.x + 10, player.y);
            ctx.lineTo(player.x - 5, player.y - 20);
            ctx.lineTo(player.x + 25, player.y);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(player.x + player.width - 10, player.y);
            ctx.lineTo(player.x + player.width + 5, player.y - 20);
            ctx.lineTo(player.x + player.width - 25, player.y);
            ctx.fill();

            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(player.x + 25, player.y + 20, 8, 0, Math.PI * 2);
            ctx.arc(player.x + player.width - 25, player.y + 20, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(player.x + 25, player.y + 20, 3, 0, Math.PI * 2);
            ctx.arc(player.x + player.width - 25, player.y + 20, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Snout
            ctx.fillStyle = '#FDE047'; // light yellow/tan
            ctx.beginPath();
            ctx.roundRect(player.x + 20, player.y + 35, 40, 20, 8);
            ctx.fill();

            // Nose
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + 35, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBalloon() {
            ctx.fillStyle = BALLOON_COLOR;
            ctx.beginPath();
            // Oval shape
            ctx.ellipse(balloon.x, balloon.y, balloon.radius, balloon.radius * 1.1, 0, 0, Math.PI * 2);
            ctx.fill();

            // Balloon tie
            ctx.beginPath();
            ctx.moveTo(balloon.x, balloon.y + balloon.radius * 1.1);
            ctx.lineTo(balloon.x - 5, balloon.y + balloon.radius * 1.1 + 8);
            ctx.lineTo(balloon.x + 5, balloon.y + balloon.radius * 1.1 + 8);
            ctx.fill();
            
            // String
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(balloon.x, balloon.y + balloon.radius * 1.1 + 8);
            ctx.quadraticCurveTo(balloon.x - 10, balloon.y + balloon.radius * 1.5, balloon.x + 5, balloon.y + balloon.radius * 2);
            ctx.stroke();

            // Highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.ellipse(balloon.x - 8, balloon.y - 10, 6, 10, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function update() {
            // Player movement
            if (player.targetX !== null) {
                const dx = player.targetX - player.x;
                if (Math.abs(dx) > player.speed) {
                    player.x += Math.sign(dx) * player.speed;
                } else {
                    player.x = player.targetX;
                }
            } else {
                if (keys.ArrowLeft) player.x -= player.speed;
                if (keys.ArrowRight) player.x += player.speed;
            }

            // Boundaries for player
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Balloon physics
            balloon.dy += balloon.gravity;
            balloon.x += balloon.dx;
            balloon.y += balloon.dy;

            // FX: Balloon Trail
            trail.push({x: balloon.x, y: balloon.y, radius: balloon.radius});
            if (trail.length > 7) trail.shift();

            // Wall collision
            if (balloon.x - balloon.radius < 0) {
                balloon.x = balloon.radius;
                balloon.dx *= -1;
                screenShake = 3;
            } else if (balloon.x + balloon.radius > canvas.width) {
                balloon.x = canvas.width - balloon.radius;
                balloon.dx *= -1;
                screenShake = 3;
            }

            // Ceiling collision
            if (balloon.y - balloon.radius < 0) {
                balloon.y = balloon.radius;
                balloon.dy *= -1;
                screenShake = 3;
            }

            // Player collision (Keepy Uppy!)
            if (balloon.dy > 0 && 
                balloon.y + balloon.radius > player.y && 
                balloon.y - balloon.radius < player.y + player.height &&
                balloon.x + balloon.radius > player.x && 
                balloon.x - balloon.radius < player.x + player.width) {
                
                // Bounce
                balloon.y = player.y - balloon.radius;
                
                // Add some variation to bounce based on where it hit
                const hitPoint = (balloon.x - (player.x + player.width / 2)) / (player.width / 2);
                balloon.dx = hitPoint * 6;
                
                // Increase speed slightly over time
                const speedModifier = Math.min(1.6, 1 + score * 0.03);
                balloon.dy = balloon.baseDy * speedModifier;
                
                score++;
                scoreDisplay.textContent = score;

                // --- ARCADE FX ---
                
                // 1. CSS Pop
                scoreDisplay.classList.remove('score-pop');
                void scoreDisplay.offsetWidth; // trigger reflow
                scoreDisplay.classList.add('score-pop');

                // 2. Camera Punch
                screenShake = 15 + Math.min(score, 10);
                screenZoom = 1.08;

                // 3. Explosion Particles
                for(let i=0; i<25; i++) {
                    particles.push({
                        x: balloon.x,
                        y: player.y,
                        dx: (Math.random() - 0.5) * 16,
                        dy: (Math.random() - 1) * 12,
                        life: 1,
                        color: ['#EF4444', '#FFFFFF', '#FDE047', '#60A5FA'][Math.floor(Math.random()*4)],
                        size: Math.random() * 6 + 3
                    });
                }

                // 4. Floating Arcade Text
                const words = ["BOING!", "WHACK!", "BOP!", "KEEPY!", "UPPY!", "BING!"];
                floatingTexts.push({
                    x: balloon.x,
                    y: player.y - 30,
                    text: words[Math.floor(Math.random()*words.length)],
                    life: 1,
                    dy: -3
                });
            }

            // FX: Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.4; // gravity
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // FX: Update Floating Texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.dy;
                ft.life -= 0.02;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // FX: Camera decay
            screenShake *= 0.85;
            if (screenShake < 0.1) screenShake = 0;
            screenZoom = 1 + (screenZoom - 1) * 0.85;

            // Game Over
            if (balloon.y - balloon.radius > canvas.height - 40) { // Check against grass height
                screenShake = 25; // Massive shake on game over
                endGame();
            }
        }

        function draw() {
            ctx.save();
            
            // Apply Camera Shake and Zoom
            let shakeX = (Math.random() - 0.5) * screenShake;
            let shakeY = (Math.random() - 0.5) * screenShake;

            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(screenZoom, screenZoom);
            ctx.translate(-canvas.width / 2 + shakeX, -canvas.height / 2 + shakeY);

            // Clear and draw oversized background to prevent edge peek
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(-150, -150, canvas.width + 300, canvas.height + 300);

            // Grass
            ctx.fillStyle = '#4ADE80';
            ctx.fillRect(-150, canvas.height - 40, canvas.width + 300, 40 + 150);

            if (gameActive || !gameActive) {
                // Draw Trail
                for (let i = 0; i < trail.length; i++) {
                    const t = trail[i];
                    ctx.fillStyle = `rgba(239, 68, 68, ${i / trail.length * 0.4})`;
                    ctx.beginPath();
                    ctx.ellipse(t.x, t.y, t.radius * (i / trail.length), t.radius * 1.1 * (i / trail.length), 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                drawPlayer();
                drawBalloon();

                // Draw Particles
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                });

                // Draw Floating Texts
                ctx.font = '900 28px "Comic Sans MS", "Chalkboard SE", sans-serif';
                ctx.textAlign = 'center';
                floatingTexts.forEach(ft => {
                    ctx.globalAlpha = ft.life;
                    ctx.fillStyle = '#FFD700';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 5;
                    
                    let scale = 1 + (1 - ft.life) * 0.5;
                    ctx.save();
                    ctx.translate(ft.x, ft.y);
                    ctx.scale(scale, scale);
                    ctx.strokeText(ft.text, 0, 0);
                    ctx.fillText(ft.text, 0, 0);
                    ctx.restore();
                    ctx.globalAlpha = 1.0;
                });
            }

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            resizeCanvas();
            initEntities();
            
            // Reset state
            score = 0;
            screenShake = 0;
            screenZoom = 1;
            particles = [];
            floatingTexts = [];
            trail = [];
            
            scoreDisplay.textContent = '0';
            scoreDisplay.classList.remove('score-pop');
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            scoreDisplay.style.display = 'block';
            
            gameActive = true;
            cancelAnimationFrame(animationId);
            gameLoop();
        }

        function endGame() {
            gameActive = false;
            scoreDisplay.style.display = 'none';
            finalScoreSpan.textContent = score;
            gameOverScreen.style.display = 'block';
            draw(); // Draw final state with shake
        }

        // Initialize display
        resizeCanvas();
        draw(); // initial draw
    </script>
</body>
</html>
